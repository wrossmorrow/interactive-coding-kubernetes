name: Containers

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      agentrunner_tag:
        description: "Base agentrunner image tag (e.g. latest or 0.0.6)"
        required: false
        default: "latest"
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  session-hub:
    name: Build & push session-hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/k8s-agents-session-hub
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push session-hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/session-hub/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=session-hub
          cache-to: type=gha,mode=max,scope=session-hub

  sandbox:
    name: Build & push sandbox (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent
            base_image: agentrunner-agent
            base_tag: ""
          - name: golang
            base_image: agentrunner-golang
            base_tag: ""
          - name: python
            base_image: agentrunner-python
            base_tag: ""
          - name: rust
            base_image: agentrunner-rust
            base_tag: ""
          - name: java17
            base_image: agentrunner-java
            base_tag: "17"
          - name: java21
            base_image: agentrunner-java
            base_tag: "21"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve base image
        id: base
        env:
          INPUT_TAG: ${{ inputs.agentrunner_tag || 'latest' }}
          MATRIX_BASE_IMAGE: ${{ matrix.base_image }}
          MATRIX_BASE_TAG: ${{ matrix.base_tag }}
        run: |
          tag="${MATRIX_BASE_TAG:-$INPUT_TAG}"
          echo "ref=${REGISTRY}/${IMAGE_OWNER}/${MATRIX_BASE_IMAGE}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/k8s-agents-sandbox-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push sandbox-${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/sandbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.ref }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sandbox-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=sandbox-${{ matrix.name }}
