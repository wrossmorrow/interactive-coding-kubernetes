name: Agent Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
      - 'testdata/*'

permissions:
  contents: read

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      ${{
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]' &&
        github.actor != 'renovate[bot]' &&
        !contains(github.event.pull_request.labels.*.name, 'skip-agent-review') &&
        !contains(github.event.pull_request.title, '[skip review]')
      }}
    runs-on: interactive-coding-kubernetes-review
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: gate
        run: |
          commit_msg="$(git log -1 --pretty=%B HEAD^2 2>/dev/null || git log -1 --pretty=%B HEAD)"
          if printf '%s\n' "$commit_msg" | grep -qiE '\[skip (agent-)?review\]'; then
            echo "::notice::Skipping agent review due to commit opt-out marker."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.skip != 'true'
        uses: wrossmorrow/github-agent-runner/action@v0.0.13
        with:
          instructions: |
            Review the PR diff against ${{ github.base_ref }}.
            Deterministic checks (gofmt, go vet, go test -race, helm lint, actionlint)
            already run in CI—do NOT spend turns repeating style or formatting nits.

            Focus strictly on HIGH-SIGNAL issues:
            1. Security & isolation boundaries:
               - Ensure secrets, ambient tokens (GITHUB_TOKEN, GH_TOKEN, APP keys), and cloud credentials
                 never leak into sandbox pods or local subprocesses (verify local-vs-k8s parity).
               - Verify RBAC roles, ServiceAccount verbs (e.g. list/get distinctions), NetworkPolicies,
                 and Squid allowlists remain least-privilege and sufficient for all code paths.
            2. Concurrency, state drift & race conditions:
               - Look for TOCTOU races, uncoordinated store-vs-daemon flushes, cache invalidation bugs
                 (such as conditional ETag advancing before successful execution), and UI state machine deadlocks.
            3. Cross-layer consistency & critical runtime bugs:
               - Byte slicing / UTF-8 indexing panics, unhandled error drops in hub/daemon/spawner paths,
                 or broken invariants across Go packages, UI, and the Helm chart.

            Do NOT report:
            - Missing unit tests or test coverage gaps unless an essential security invariant is completely untested.
            - Missing documentation in README.md or values.yaml comments.
            - Theoretical input sanitization nits (e.g. negative numbers, cosmetic validation) unless externally exploitable.

            Severity rules:
            - `error`: Only for concrete logic bugs, runtime panics, RBAC permission errors, or security/token leaks.
            - `warning`: Plausible race conditions or state-loss edges that can occur in normal operation.
            - Do NOT emit `info`-level findings for documentation, style, or hypothetical future improvements.

            For small, locally verified fixes inside a single diff hunk, you may include a
            "suggestion" (and optional "startLine" < "line") on the inline comment.
          fail-on: error
          output: suggest
