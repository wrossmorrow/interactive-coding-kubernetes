<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi workbench</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171520'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='20' text-anchor='middle' fill='%23c9b8ff'%3E%CF%80%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<script src="vendor/marked.umd.js"></script>
<script src="vendor/purify.min.js"></script>
</head>
<body>
<div id="shell">
  <aside id="sidebar">
    <div class="sb-head">
      <span class="sb-brand">π sessions</span>
      <button id="btn-new" type="button" class="btn primary">+ new</button>
    </div>
    <div class="sb-filters">
      <input id="sb-search" type="search" placeholder="search name, id, repo, branch, model, PR, wake…" autocomplete="off" spellcheck="false">
      <div class="sb-filter-row">
        <select id="sb-kind" title="Filter by session kind">
          <option value="all">All</option>
          <option value="interactive">Interactive</option>
          <option value="analyst">Analyst</option>
          <option value="review">CI Review</option>
        </select>
        <select id="sb-status" title="Filter by session status">
          <option value="all">All</option>
          <option value="live">Active / Needs Attention</option>
          <option value="paused">Paused</option>
          <option value="closed">Closed</option>
        </select>
      </div>
      <div id="sb-filter-meta" class="sb-filter-row" hidden>
        <span id="sb-count" class="dim"></span>
        <span class="grow"></span>
        <button id="sb-clear" type="button" class="mini-btn">clear filters</button>
      </div>
    </div>
    <div id="session-list"></div>
  </aside>

  <div id="app">
    <header id="topbar">
      <div class="tb-left">
        <span id="tb-title" class="tb-title">Select or create a session</span>
        <span id="tb-badge" class="badge" hidden></span>
        <span id="tb-meta" class="dim"></span>
      </div>
      <div class="tb-actions" id="tb-actions"></div>
    </header>

    <div id="busy-banner" hidden>
      <span class="busy-dot">●</span>
      <span id="busy-msg"></span>
      <span id="busy-elapsed" class="dim"></span>
    </div>

    <div id="archive-banner" hidden>
      <span id="archive-msg"></span>
      <div id="archive-actions"></div>
    </div>

    <main id="scroll">
      <div id="transcript"></div>
      <div id="spinner" hidden></div>
    </main>
    <button id="jump" type="button" hidden>↓ new output</button>

    <section id="bottom">
      <div id="widgets-above" class="widgets"></div>
      <div id="queue"></div>
      <div id="attachments"></div>
      <div id="dialog" hidden></div>
      <div id="editor" class="editor" hidden>
        <div class="editor-rule top"><span class="rule-label" id="editor-label"></span></div>
        <textarea id="input" rows="1" spellcheck="false" autocomplete="off" placeholder="message pi  ·  / commands  ·  ! bash"></textarea>
        <div class="editor-rule bottom"><span class="rule-hint" id="editor-hint"></span></div>
        <div id="popup" hidden></div>
      </div>
      <div id="widgets-below" class="widgets"></div>
      <footer id="footer">
        <div class="footer-row">
          <span id="f-cwd" class="dim"></span>
          <span class="grow"></span>
          <span id="f-status" class="dim"></span>
        </div>
        <div class="footer-row">
          <span id="f-tokens" class="dim"></span>
          <span class="grow"></span>
          <button type="button" class="chip" id="f-view-thinking" title="Show/hide thinking (ctrl+t)"></button>
          <button type="button" class="chip" id="f-view-tools" title="Expand/collapse tool output (ctrl+o)"></button>
          <button type="button" class="chip" id="f-bell" title="Desktop notification when the agent finishes or needs input"></button>
          <button type="button" class="chip" id="f-model" title="Change model"></button>
          <button type="button" class="chip" id="f-thinking" title="Thinking level (shift+tab)"></button>
          <button type="button" class="chip" id="f-help" title="Keyboard shortcuts">?</button>
          <button type="button" class="chip" id="f-flush" title="Flush session parts to hub store now">⇅</button>
        </div>
      </footer>
    </section>

    <div id="menu" hidden></div>
    <div id="conn" hidden>reconnecting…</div>
  </div>
</div>

<div id="modal-backdrop" hidden>
  <form id="new-modal">
    <div class="modal-title">New Session</div>
    <label>Mode
      <select id="nm-kind">
        <option value="interactive">interactive (coding sandbox)</option>
        <option value="analyst">analyst (read-only session archive)</option>
      </select>
    </label>
    <label>Name <input id="nm-name" type="text" placeholder="e.g. fix-auth-retry"></label>
    <label id="nm-repo-wrap">Repo <input id="nm-repo" type="text" placeholder="owner/repo (optional)"></label>
    <label>Toolchain
      <select id="nm-toolchain">
        <option value="agent">agent (base)</option>
        <option value="golang">golang</option>
        <option value="python">python</option>
        <option value="rust">rust</option>
        <option value="java21">java21</option>
        <option value="java17">java17</option>
      </select>
    </label>
    <label>Model <select id="nm-model"></select></label>
    <div class="modal-actions">
      <button type="button" class="btn" id="nm-cancel">Cancel</button>
      <button type="submit" class="btn primary">Create Session</button>
    </div>
  </form>
</div>

<script src="app.js"></script>
</body>
</html>
