apiVersion: v1
kind: ServiceAccount
metadata:
  name: session-hub
  namespace: session-system
  annotations:
    # Bind to the dedicated GCS-only GCP Service Account (Workload Identity).
    # Replace PROJECT_ID and CLUSTER_NAME via Kustomize overlay or patch.
    iam.gke.io/gcp-service-account: "CLUSTER_NAME-session-hub@PROJECT_ID.iam.gserviceaccount.com"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: session-hub-sandbox-manager
  namespace: interactive-sessions
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: session-hub-sandbox-manager
  namespace: interactive-sessions
subjects:
  - kind: ServiceAccount
    name: session-hub
    namespace: session-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: session-hub-sandbox-manager
